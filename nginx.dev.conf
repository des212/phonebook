events { }

http {
  server {
    listen 80;
    # Requests starting with root (/) are handled
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      
      proxy_pass http://app:5173;
    }
    # Requests starting with /api are handled
    location /api {
      proxy_redirect  http://server:3001/  /api;
      proxy_pass http://server:3001;
    }
    # Requests starting with /version are handled
    location /version {
      proxy_redirect  http://server:3001/  /version;
      proxy_pass http://server:3001;
    }
    # Requests starting with /health are handled
    location /health {
      proxy_redirect  http://server:3001/  /health;
      proxy_pass http://server:3001;
    }
  }
}