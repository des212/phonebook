services:
  app:
    image: phonebook-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
       - VITE_BACKEND_URL=.
    volumes:
     - ./frontend/:/usr/src/app
    #environment:
     #- VITE_BACKEND_URL=/api/
    container_name: phonebook-frontend
  server:
    image: phonebook-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
     - ./backend/:/usr/src/app
    container_name: phonebook-backend
    environment:
     - MONGODB_URL=mongodb://the_username:the_password@mongo:27017/the_database
    depends_on:
     - mongo
  mongo:
    image: mongo
    ports:
     - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes: 
     - ./backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
  nginx:
    image: nginx:1.20.1
    volumes:
     - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
     - 8080:80
    container_name: phonebook-reverse-proxy
    depends_on:
     - app
     - server